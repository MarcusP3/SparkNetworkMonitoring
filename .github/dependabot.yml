# What Dependabot may propose. Not `pip`: the runtime lock is generated by
# `uv pip compile` from pyproject.toml with hashes, and a lock edited by hand
# fails tests/test_supply_chain.py -- the weekly pip-audit job in ci.yml is
# how a Python vulnerability gets noticed, and the fix is one `uv` command
# (CLAUDE.md, "Dependencies are hash-pinned").
version: 2
updates:
  # The base image is pinned by digest on purpose (Dockerfile). This is the
  # one place a new digest gets proposed rather than found by accident.
  - package-ecosystem: docker
    directory: /spark
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
