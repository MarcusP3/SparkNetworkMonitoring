# What Dependabot may propose. Not `pip`: the runtime lock is generated by
# `uv pip compile` from pyproject.toml with hashes, and a lock edited by hand
# fails tests/test_supply_chain.py -- the weekly pip-audit job in ci.yml is
# how a Python vulnerability gets noticed, and the fix is one `uv` command
# (CLAUDE.md, "Dependencies are hash-pinned").
version: 2
updates:
  # The base image is pinned by digest on purpose (Dockerfile). This is the
  # one place a new digest gets proposed rather than found by accident.
  - package-ecosystem: docker
    directory: /spark
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, docker]
    # New digests of python:3.12-slim (OS security fixes) only. A new Python
    # (3.12 -> 3.14) is a deliberate change: the hash-pinned locks, the tests
    # and CI are all 3.12. Docker tags parse 3.14 as a *minor* bump, so both
    # minor and major are ignored here.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies, ci]
