services:
  spark:
    build:
      context: .
      args:
        # 1 (default): real ICMP via a file capability on python, with
        # `cap_add: [NET_RAW]` below. 0: no capability at all -- see the
        # "Without NET_RAW" block below for what the host needs instead.
        SETCAP_NET_RAW: "1"
    image: spark-monitor:latest
    container_name: spark
    restart: unless-stopped

    # Host networking is required, not a preference. ARP and ICMP sweeps only
    # see the LAN from the host's network namespace; on a bridge network SPARK
    # sits behind NAT and discovery finds nothing at all.
    #
    # It also means port 9700 is on every interface the VM has, and there is
    # no Docker port mapping to narrow it. SPARK serves HTTPS on it by
    # default (self-signed; the fingerprint is in the log). On a VM with more
    # than one interface, firewall the port (`ufw allow from <lan>/24 to any
    # port 9700`) rather than binding to one address: the healthcheck reaches
    # SPARK over loopback, and a single-address bind takes that away.
    network_mode: host

    # Real ICMP needs raw sockets. Without this, ping degrades to TCP probes
    # and the latency numbers stop meaning what you think they mean.
    #
    # Everything else Docker grants by default -- CHOWN, SETUID, NET_BIND_SERVICE,
    # a dozen more -- is dropped first. The process runs as uid 9700, not root
    # (see the Dockerfile), and NET_RAW reaches it through a file capability
    # on the Python binary. That is why there is no `no-new-privileges` here:
    # it would make the kernel ignore that file capability, and ICMP would
    # quietly stop working.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW

    # --- Without NET_RAW (optional, stronger) -----------------------------
    # The kernel can let ordinary users send ICMP echo through datagram
    # sockets, and SPARK's ping already falls back to that. On the VM, once:
    #
    #   echo 'net.ipv4.ping_group_range = 0 2147483647' | sudo tee /etc/sysctl.d/90-spark-ping.conf
    #   sudo sysctl --system
    #
    # Then set SETCAP_NET_RAW above to "0", delete the two cap_add lines,
    # uncomment the two below, and `docker compose up -d --build`. Confirm a
    # sweep still finds devices (Devices page, "Scan now") before you keep
    # it; if it says "ICMP unavailable", the sysctl did not take.
    # security_opt:
    #   - no-new-privileges:true

    # --- Read-only root filesystem (optional) -----------------------------
    # SPARK writes only under /data. If it fails to start with a "Read-only
    # file system" error after this, something new writes elsewhere: that is
    # a bug to report, not a reason to leave this off.
    # read_only: true
    # tmpfs:
    #   - /tmp

    # Containment. SPARK is one process with a small thread pool (Argon2
    # runs in threads, at most two at once), so a process count anywhere near
    # this means something has gone badly wrong, and stopping it there is
    # better than letting it take the VM with it.
    pids_limit: 256
    # Memory: measure first. `docker stats spark` after a day shows the
    # steady figure; three to four times that is a limit that catches a leak
    # or a runaway response (the HTTP check keeps at most 1 MB of a body)
    # without killing SPARK during a login burst. Too low and Docker kills
    # the container (exit 137) and `restart: unless-stopped` loops it.
    # mem_limit: 512m

    volumes:
      # spark.db and secret.key. Must be owned by uid 9700 on the host
      # (`sudo chown -R 9700:9700 data`); SPARK refuses to start, and says
      # exactly this, if it is not.
      - ./data:/data
      - ./config:/config:ro   # spark.yaml (copied from spark.example.yaml); SPARK never writes it
      # For your own certificate instead of the self-signed one: put it in
      # config/tls/ and set app.tls in spark.yaml to
      #   {cert: /config/tls/cert.pem, key: /config/tls/key.pem}
      # Behind a reverse proxy that terminates TLS: app.tls: off.
      # Uncomment once Docker-host inventory arrives (increment 4). Read-only,
      # and only the key SPARK uses to reach the remote daemons.
      # - ./secrets:/secrets:ro

    environment:
      - SPARK_CONFIG=/config/spark.yaml
      # Overrides for anything in spark.yaml, nested with double underscores:
      # - SPARK__APP__PORT=9700
      # - SPARK__APP__LOG_LEVEL=DEBUG
      # - SPARK__APP__TLS=off
