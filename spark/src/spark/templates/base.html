<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ config.app.instance_name }}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">⚡</span>
    <span>{{ config.app.instance_name }}</span>
  </a>
  <nav class="nav">
    <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
    <a href="/targets" class="{% if request.url.path.startswith('/targets') %}active{% endif %}">Targets</a>
    <a href="/map" class="disabled" title="Arrives with the discovery increment">Service map</a>
    <a href="/settings" class="disabled" title="Arrives with the alerting increment">Settings</a>
  </nav>
  <form method="post" action="/logout" class="logout">
    <span class="who">{{ user.username }}</span>
    <button type="submit" class="btn-quiet">Sign out</button>
  </form>
</header>
{% endif %}

<main class="{% if not user %}centered{% endif %}">
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  SPARK {{ config.app.instance_name if config.app.instance_name != 'SPARK' else '' }}
  · <span class="muted">network monitoring for homelabs</span>
</footer>
<script>
  // Live updates. The server pushes a one-line event when a target changes
  // state; the page then re-fetches itself and swaps in the #live region.
  //
  // Re-fetching the whole page and taking one element out of it means there is
  // no second set of fragment templates to keep in step with the real ones --
  // the page can only ever disagree with itself if the server is wrong.
  // Swapping #live rather than reloading keeps scroll position and anything
  // typed into a form outside it.
  (function () {
    var live = document.getElementById('live');
    if (!live || !window.EventSource) return;

    var inFlight = false;

    function statusesById(root) {
      var map = {};
      root.querySelectorAll('[data-target-id]').forEach(function (row) {
        map[row.getAttribute('data-target-id')] = row.getAttribute('data-status');
      });
      return map;
    }

    function refresh() {
      if (inFlight) return;          // a burst of changes is still one fetch
      inFlight = true;
      var before = statusesById(live);
      fetch(window.location.pathname, { headers: { 'X-Requested-With': 'fetch' } })
        .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
        .then(function (html) {
          var doc = new DOMParser().parseFromString(html, 'text/html');
          var next = doc.getElementById('live');
          if (!next) return;
          live.innerHTML = next.innerHTML;
          // Mark rows whose status actually moved, so a change that happens
          // while you are looking elsewhere is not silently absorbed.
          live.querySelectorAll('[data-target-id]').forEach(function (row) {
            var id = row.getAttribute('data-target-id');
            if (before[id] !== undefined &&
                before[id] !== row.getAttribute('data-status')) {
              row.classList.add('just-changed');
            }
          });
        })
        .catch(function () { /* a failed refresh is not worth surfacing */ })
        .finally(function () { inFlight = false; });
    }

    // EventSource reconnects on its own if the server restarts, so there is no
    // retry logic here on purpose.
    var source = new EventSource('/events');
    source.addEventListener('change', refresh);
  })();
</script>
</body>
</html>
