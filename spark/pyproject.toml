[project]
name = "spark-monitor"
version = "0.1.0"
description = "SPARK - homelab network monitoring: health, alerting, and a live service map"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "apscheduler>=3.10",
]

[project.scripts]
spark = "spark.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark"]
