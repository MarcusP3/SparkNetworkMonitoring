[project]
name = "spark-monitor"
version = "0.1.0"
description = "SPARK - homelab network monitoring: health, alerting, and a live service map"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "Marcus Pierce" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # uvicorn without its [standard] extra, which also pulled in watchfiles
    # (--reload) and python-dotenv (--env-file): development conveniences
    # that never run in the container. The parts of the extra SPARK does use
    # are named here so they cannot quietly disappear from the lock.
    "uvicorn>=0.32",
    "uvloop>=0.21",
    "httptools>=0.6",
    # The TrueNAS client (truenas.py) speaks JSON-RPC over a WebSocket. This
    # used to arrive only through uvicorn[standard]; a dependency the code
    # imports is declared by the code's own project.
    "websockets>=15",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pysnmp>=7.1",
    "icmplib>=3.0",
    "dnspython>=2.6",
    # Two jobs. pysnmp needs it for SNMPv3 privacy (AES/DES) and silently
    # disables encryption without it; SPARK uses it to encrypt the stored
    # SNMP credentials. See tests/test_snmp_crypto.py for why it is tested.
    "cryptography>=44",
]

[project.scripts]
spark = "spark.main:run"
spark-probe = "spark.cli:probe_main"
spark-reset-password = "spark.cli:reset_password_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "watchfiles>=0.20"]  # watchfiles: `uvicorn --reload` in development

[tool.pytest.ini_options]
testpaths = ["tests"]
